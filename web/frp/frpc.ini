# ============================================
# frpc.ini —— 部署在推理主机上
# 通过 frp TCP 隧道，把本机 FastAPI 暴露到公网，
# 设备端/网页用户即可通过公网地址访问并上传媒体与内外参。
# ============================================
[common]
# frps 公网地址与端口
server_addr = frp-oil.com
server_port = 7000

# 与 frps 一致的 token
auth.token = Umse30lxiv8nh

# ---------- 主通道：TCP 隧道 ----------
[omni3d-http]
type = tcp
local_ip = 127.0.0.1
local_port = 50685       # 本机 FastAPI 端口（与 server.py 默认一致）
remote_port = 50865      # 公网端口：设备端访问 http://frp-oil.com:50865

# ---------- 副通道：UDP 隧道（实时视频流 / 实时位姿流，自定义协议） ----------
# [omni3d-stream]
# type = udp
# local_ip = 127.0.0.1
# local_port = 9000       # 本机 UDP 流接收端口
# remote_port = 19000     # 公网 UDP 端口
